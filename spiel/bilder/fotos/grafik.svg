<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240" role="img"><title>Grafik: Hämoglobin sinkt von 12,9 auf 11,2, der letzte Wert liegt unter dem Normbereich</title>
<rect width="380" height="240" fill="#ffffff"/>
<text x="48" y="20" font-size="12" font-weight="700" fill="#1a1a1a" font-family="Arial, sans-serif">Hämoglobin (g/dl)</text>
<rect x="48" y="56.3" width="312" height="89.1" fill="#e3f1e7"/>
<text x="356" y="70.3" font-size="9" text-anchor="end" fill="#1f6b3a" font-family="Arial, sans-serif">Normbereich 12,0 bis 16,0</text>
<line x1="48" y1="34" x2="48" y2="190" stroke="#555"/>
<line x1="48" y1="190" x2="360" y2="190" stroke="#555"/>
<text x="42" y="194.0" font-size="9" text-anchor="end" fill="#444" font-family="Arial, sans-serif">10</text>
<line x1="45" y1="190.0" x2="48" y2="190.0" stroke="#555"/>
<text x="42" y="149.4" font-size="9" text-anchor="end" fill="#444" font-family="Arial, sans-serif">12</text>
<line x1="45" y1="145.4" x2="48" y2="145.4" stroke="#555"/>
<text x="42" y="104.9" font-size="9" text-anchor="end" fill="#444" font-family="Arial, sans-serif">14</text>
<line x1="45" y1="100.9" x2="48" y2="100.9" stroke="#555"/>
<text x="42" y="60.3" font-size="9" text-anchor="end" fill="#444" font-family="Arial, sans-serif">16</text>
<line x1="45" y1="56.3" x2="48" y2="56.3" stroke="#555"/>
<polyline fill="none" stroke="#2f5d8a" stroke-width="2.5" points="88,125.4 204,143.2 330,163.3"/>
<circle cx="88" cy="125.4" r="5" fill="#2f5d8a"/>
<text x="88" y="113.4" font-size="11" font-weight="700" text-anchor="middle" fill="#2f5d8a" font-family="Arial, sans-serif">12,9</text>
<text x="88" y="206" font-size="10" text-anchor="middle" fill="#333" font-family="Arial, sans-serif">03.2024</text>
<circle cx="204" cy="143.2" r="5" fill="#2f5d8a"/>
<text x="204" y="131.2" font-size="11" font-weight="700" text-anchor="middle" fill="#2f5d8a" font-family="Arial, sans-serif">12,1</text>
<text x="204" y="206" font-size="10" text-anchor="middle" fill="#333" font-family="Arial, sans-serif">09.2025</text>
<circle cx="330" cy="163.3" r="7" fill="#b3261e"/>
<text x="330" y="151.3" font-size="11" font-weight="700" text-anchor="middle" fill="#b3261e" font-family="Arial, sans-serif">11,2</text>
<text x="330" y="206" font-size="10" text-anchor="middle" fill="#333" font-family="Arial, sans-serif">05.2026</text>
<text x="48" y="232" font-size="9" fill="#555" font-family="Arial, sans-serif">Erfundene Werte. Rot: ausserhalb des Normbereichs.</text>
</svg>
